version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mafia-game-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-mafia_game}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - mafia-game-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mafia-game-redis-prod
    networks:
      - mafia-game-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mafia-game-backend-prod
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-mafia_game}
      DB_SYNC: false
      REDIS_URL: redis://redis:6379
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - mafia-game-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mafia-game-frontend-prod
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3000}
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - mafia-game-network
    restart: unless-stopped

networks:
  mafia-game-network:
    driver: bridge

volumes:
  postgres_data_prod:
