version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mafia-game-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mafia_game
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mafia-game-network

  redis:
    image: redis:7-alpine
    container_name: mafia-game-redis
    ports:
      - "6379:6379"
    networks:
      - mafia-game-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mafia-game-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: mafia_game
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - mafia-game-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mafia-game-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: ws://localhost:3000
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - mafia-game-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

networks:
  mafia-game-network:
    driver: bridge

volumes:
  postgres_data:
